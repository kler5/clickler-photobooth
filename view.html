<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your CLICKLER Photo</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f0eb;color:#29252a;font-family:Arial,sans-serif;text-align:center}main{max-width:620px;margin:20px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:24px;letter-spacing:2px}p{color:#777;font-size:14px}img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;margin:20px auto;border-radius:10px}a{display:inline-block;background:#29252a;color:#fff;text-decoration:none;padding:15px 26px;border-radius:9px;font-weight:bold}#error{display:none;color:#a33}
</style>
</head>
<body><main><h1>YOUR CLICKLER PHOTO ✦</h1><p>Your memory is ready. Tap below to save it to your phone.</p><img id="photo" alt="Your photobooth photo"><p id="error">Sorry, this photo link is invalid or unavailable.</p><a id="download" href="#" download="clickler-photo.jpg">DOWNLOAD PHOTO</a><p>Thank you for taking a photo with CLICKLER!</p></main>
<script>
const params=new URLSearchParams(location.search);const src=params.get('photo');const img=document.getElementById('photo');const btn=document.getElementById('download');const err=document.getElementById('error');
try{const u=new URL(src);if(u.protocol!=='https:'||!u.pathname.includes('/storage/v1/object/public/booth-photos/'))throw new Error('Invalid photo URL');img.src=u.href;btn.href=u.href;img.onerror=()=>{img.style.display='none';btn.style.display='none';err.style.display='block'};}catch(e){img.style.display='none';btn.style.display='none';err.style.display='block'}
</script></body></html>
